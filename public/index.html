<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>실시간 도심 쉼표 지도</title>
  <link rel="stylesheet" href="./main.css" />
  <script type="module" src="./main.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body>
  <header class="app-header">
    <h1>실시간 도심 쉼표 지도</h1>
    <p>내 주변의 한적하고 쾌적한 쉼표 스팟을 추천합니다.</p>
  </header>

  <main class="app-container">
    <section class="control-panel">
      <h2>추천 조건</h2>

      <div id="status-message">위치 정보를 불러올 준비가 되었습니다.</div>

      <div class="weight-panel">
        <label>
          거리
          <input id="weight-distance" type="range" min="0" max="1" step="0.01" />
        </label>

        <label>
          혼잡도
          <input id="weight-crowd" type="range" min="0" max="1" step="0.01" />
        </label>

        <label>
          대기질
          <input id="weight-air" type="range" min="0" max="1" step="0.01" />
        </label>

        <label>
          카페 선호도
          <input id="weight-cafe" type="range" min="0" max="1" step="0.01" />
        </label>
        <label>
          공원 선호도
          <input id="weight-park" type="range" min="0" max="1" step="0.01" />
        </label>
        <label>
          산책로 선호도
          <input id="weight-walk" type="range" min="0" max="1" step="0.01" />
        </label>
      </div>

      <select id="place-type">
        <option value="all">전체</option>
        <option value="cafe">카페</option>
        <option value="park">공원</option>
        <option value="walk">산책로</option>
      </select>

      <button id="recommend-button">내 주변 쉼표 찾기</button>
    </section>

    <section class="result-panel">
      <h2>추천 장소</h2>
      <div id="place-list"></div>
      <button id="load-more-button" type="button" hidden>더보기</button>
    </section>

    <section class="visual-panel">
      <div class="map-box">
        <h2>현재 위치 지도</h2>
        <div id="map"></div>
      </div>

      <div class="chart-box">
        <h2>시간대별 혼잡도</h2>
        <svg id="congestion-chart"></svg>
      </div>

      <div class="network-box">
        <h2>주변 대안 장소 네트워크</h2>
        <div id="sigma-container"></div>
      </div>
    </section>
  </main>
</body>

</html>
